name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-validate-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24.x"]
        openclaw-version: ["2026.6.8", "2026.6.9"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Install OpenClaw ${{ matrix.openclaw-version }}
        # Keep last: this compatibility probe intentionally desynchronizes node_modules from package-lock.json.
        run: npm install --no-save --no-package-lock openclaw@${{ matrix.openclaw-version }}

      - name: Build and check manifest is not stale
        run: npm run plugin:build:check

      - name: Validate plugin metadata
        run: npx openclaw plugins validate --entry ./dist/index.js

      - name: Test
        run: npm test

      - name: Enforce coverage floor
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0' && matrix.openclaw-version == '2026.6.9'
        run: npm run test:coverage

      - name: Smoke-test packed artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22.19.0' && matrix.openclaw-version == '2026.6.9'
        run: npm run test:pack

      - name: Typecheck tests
        run: npm run test:typecheck

      - name: Check whitespace and conflict markers only
        run: git diff --check
